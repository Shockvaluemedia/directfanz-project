name: CI

# Runs the full quality gate on the real working branches. `integration-testing`
# is the active default branch; `main` is included so the same gate applies if/when
# main becomes the production branch.
on:
  push:
    branches: [integration-testing, main]
  pull_request:
    branches: [integration-testing, main]

env:
  NODE_VERSION: '20'

jobs:
  quality:
    name: Typecheck, Lint, Test, Audit, Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      # ffmpeg-static's postinstall downloads a binary from GitHub releases,
      # which is not required to typecheck/lint/test/build.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint:check

      - name: Test
        run: npm test -- --coverage
        env:
          NODE_ENV: test
          NEXTAUTH_SECRET: test_secret_ci_placeholder_value_32chars
          NEXTAUTH_URL: http://localhost:3000

      - name: Dependency audit (fail on high/critical)
        run: npm audit --audit-level=high

      - name: Build
        run: npm run build
        env:
          # Placeholder values so the production build can run in CI. Real
          # secrets are configured in the hosting provider, never here.
          NODE_ENV: production
          NEXTAUTH_SECRET: build_time_placeholder_secret_value_32c
          NEXTAUTH_URL: http://localhost:3000
          DATABASE_URL: postgresql://user:pass@localhost:5432/db
          STRIPE_SECRET_KEY: sk_test_placeholder
          STRIPE_PUBLISHABLE_KEY: pk_test_placeholder
          NEXT_PUBLIC_APP_URL: http://localhost:3000
