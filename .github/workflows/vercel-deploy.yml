name: Deploy to Vercel

on:
  push:
    branches:
      - main
      - integration-testing
  pull_request:
    branches:
      - main
      - integration-testing

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest

    steps:
      # Deploys require Vercel credentials that are configured manually in the
      # repository secrets (see PRODUCTION_READINESS.md). When they are absent
      # this job is a green no-op instead of a hard failure, so it never blocks
      # a PR before deployment has been set up.
      - name: Check Vercel credentials
        id: creds
        run: |
          if [ -n "${{ secrets.VERCEL_TOKEN }}" ] && [ -n "${{ secrets.VERCEL_PROJECT_ID }}" ] && [ -n "${{ secrets.VERCEL_ORG_ID }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Vercel secrets (VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID) are not configured; skipping deploy."
          fi

      - name: Checkout code
        if: steps.creds.outputs.configured == 'true'
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: steps.creds.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Vercel CLI
        if: steps.creds.outputs.configured == 'true'
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        if: steps.creds.outputs.configured == 'true'
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      # Only sync production env vars from a real production deploy (push to main),
      # never from a PR preview build.
      - name: Set Environment Variables in Vercel
        if: steps.creds.outputs.configured == 'true' && github.ref == 'refs/heads/main'
        run: |
          echo "Setting environment variables in Vercel..."

          # Core secrets from GitHub Secrets
          echo "${{ secrets.NEXTAUTH_SECRET }}" | vercel env add NEXTAUTH_SECRET production --token=${{ secrets.VERCEL_TOKEN }} --yes || true
          echo "${{ secrets.ENCRYPTION_KEY }}" | vercel env add ENCRYPTION_KEY production --token=${{ secrets.VERCEL_TOKEN }} --yes || true
          echo "${{ secrets.JWT_SECRET }}" | vercel env add JWT_SECRET production --token=${{ secrets.VERCEL_TOKEN }} --yes || true

          # Configuration
          echo "production" | vercel env add NODE_ENV production --token=${{ secrets.VERCEL_TOKEN }} --yes || true
          echo "${{ secrets.NEXTAUTH_URL }}" | vercel env add NEXTAUTH_URL production --token=${{ secrets.VERCEL_TOKEN }} --yes || true

          # Database
          echo "${{ secrets.DATABASE_URL }}" | vercel env add DATABASE_URL production --token=${{ secrets.VERCEL_TOKEN }} --yes || true

          # Stripe
          echo "${{ secrets.STRIPE_SECRET_KEY }}" | vercel env add STRIPE_SECRET_KEY production --token=${{ secrets.VERCEL_TOKEN }} --yes || true
          echo "${{ secrets.STRIPE_PUBLISHABLE_KEY }}" | vercel env add STRIPE_PUBLISHABLE_KEY production --token=${{ secrets.VERCEL_TOKEN }} --yes || true
          echo "${{ secrets.STRIPE_WEBHOOK_SECRET }}" | vercel env add STRIPE_WEBHOOK_SECRET production --token=${{ secrets.VERCEL_TOKEN }} --yes || true

          # Vercel Blob (if set)
          if [ -n "${{ secrets.BLOB_READ_WRITE_TOKEN }}" ]; then
            echo "${{ secrets.BLOB_READ_WRITE_TOKEN }}" | vercel env add BLOB_READ_WRITE_TOKEN production --token=${{ secrets.VERCEL_TOKEN }} --yes || true
          fi

          # SendGrid (if set)
          if [ -n "${{ secrets.SENDGRID_API_KEY }}" ]; then
            echo "${{ secrets.SENDGRID_API_KEY }}" | vercel env add SENDGRID_API_KEY production --token=${{ secrets.VERCEL_TOKEN }} --yes || true
            echo "${{ secrets.FROM_EMAIL }}" | vercel env add FROM_EMAIL production --token=${{ secrets.VERCEL_TOKEN }} --yes || true
          fi

          # Redis (if set)
          if [ -n "${{ secrets.REDIS_URL }}" ]; then
            echo "${{ secrets.REDIS_URL }}" | vercel env add REDIS_URL production --token=${{ secrets.VERCEL_TOKEN }} --yes || true
          fi

          echo "✅ Environment variables synced from GitHub Secrets to Vercel"

      - name: Build Project Artifacts
        if: steps.creds.outputs.configured == 'true'
        run: vercel build ${{ github.ref == 'refs/heads/main' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }}
        env:
          # Provide env vars for build time
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}

      - name: Deploy to Vercel (Production)
        if: steps.creds.outputs.configured == 'true' && github.ref == 'refs/heads/main'
        run: |
          vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }} > deployment-url.txt
          echo "DEPLOYMENT_URL=$(cat deployment-url.txt)" >> $GITHUB_ENV

      - name: Deploy to Vercel (Preview)
        if: steps.creds.outputs.configured == 'true' && github.ref != 'refs/heads/main'
        run: |
          vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }} > deployment-url.txt
          echo "DEPLOYMENT_URL=$(cat deployment-url.txt)" >> $GITHUB_ENV

      - name: Deployment Summary
        if: steps.creds.outputs.configured == 'true'
        run: |
          echo "🚀 Deployment successful!"
          echo "📍 URL: ${{ env.DEPLOYMENT_URL }}"
          echo "🌿 Branch: ${{ github.ref_name }}"
          echo "📦 Commit: ${{ github.sha }}"

      - name: Comment on PR (Preview Deployments)
        if: steps.creds.outputs.configured == 'true' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🚀 Preview Deployment Ready\n\n✅ Your preview deployment is ready!\n\n**URL**: ${{ env.DEPLOYMENT_URL }}\n**Branch**: \`${{ github.ref_name }}\`\n**Commit**: \`${{ github.sha }}\`\n\nThis preview will be automatically updated on new commits.`
            })
