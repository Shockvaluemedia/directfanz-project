name: Deploy to AWS ECS

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to publish"
        required: true
        default: "latest"
      deploy_environment:
        description: "Target environment"
        required: true
        default: "production"
        type: choice
        options:
          - staging
          - production

env:
  AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
  IMAGE_TAG: ${{ inputs.image_tag }}

jobs:
  deploy:
    name: Build and deploy ECS services
    runs-on: ubuntu-latest
    environment: ${{ inputs.deploy_environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run pre-deploy checks
        run: |
          npm run typecheck
          npm run lint:check
          npm test -- --passWithNoTests
          npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify required SSM parameters
        run: npm run aws:ssm:check

      - name: Deploy containers to ECS
        run: npm run aws:deploy
